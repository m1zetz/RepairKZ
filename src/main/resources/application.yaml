server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 100

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false

  application:
    name: RepairKZ-Backend

security:
  key: ${JWT_SECRET}

logging:
  level:
    org.springframework.web: INFO
    root: INFO

mailersend:
  api-key: ${RESEND_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics